name: Feature request
description: Propose a new stage, source/sink, binding, or option.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a request, check [todo.md](https://github.com/tpt-solutions/tpt-streamforge/blob/master/todo.md) —
        the "Engine Feature Gaps" section lists what is already planned.
  - type: dropdown
    id: surface
    attributes:
      label: Which surface should this land in?
      options:
        - Rust (tpt-stream-core / tpt-stream-columnar / tpt-csv)
        - Python (tpt-streamforge)
        - Node.js (tpt-streamforge-node)
        - Browser (tpt-streamforge-browser)
        - CLI (tptforge)
        - C ABI (tpt-stream-ffi)
        - Docs / examples / CI
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow you cannot express today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behaviour
      description: |
        Rough sketch is fine — a snippet in any supported language, or the
        pipeline/SQL you would like to be able to write.
      render: text
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including anything you tried with the existing stages/sources.
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      description: This project has hard rules that proposals must respect.
      options:
        - label: This needs no cloud SDK dependency (S3/GCS/Azure go through bare HTTP + signing).
          required: true
        - label: This can be implemented without adding an Apache-2.0-only dependency (`cargo deny` must stay green).
          required: true
        - label: I am willing to open a pull request for this.
          required: false
