name: Release

# TODO(F11): pin every `uses:` to a full commit SHA (`uses: owner/repo@<sha> # vN`).
# Tags are mutable; resolve SHAs with `gh api repos/OWNER/REPO/commits/TAG --jq .sha`
# (or pinact/Dependabot) rather than typing them by hand.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          working-directory: tpt-stream-py
          args: --release --locked --out dist
      - name: Run pytest on the wheel
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --quiet pytest
          python -m pip install --quiet tpt-stream-py/dist/tpt_streamforge-*.whl
          python -m pytest tpt-stream-py/python/tests -q
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: tpt-stream-py/dist/*.whl

  binaries:
    name: tptforge binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  archive: tar.gz }
          - { os: macos-latest,   target: aarch64-apple-darwin,      archive: tar.gz }
          - { os: macos-latest,   target: x86_64-apple-darwin,       archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release -p tpt-stream-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="tptforge-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bin=tptforge
          [ "${{ matrix.archive }}" = zip ] && bin=tptforge.exe
          cp "target/${{ matrix.target }}/release/$bin" "dist/$name/"
          cp LICENSE-MIT LICENSE-APACHE tpt-stream-cli/README.md "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: dist/*

  github-release:
    name: GitHub release (checksums + provenance + SBOM)
    needs: [binaries, quality]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release and upload assets
      id-token: write     # sign the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate SBOM (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all-features
          # cargo-cyclonedx's output filename varies by version; take whatever it wrote for the CLI crate.
          sbom=$(find tpt-stream-cli -maxdepth 1 -name '*.cyclonedx.json' | head -n1)
          test -n "$sbom"
          cp "$sbom" "dist/tptforge-${GITHUB_REF_NAME}.cyclonedx.json"
      - name: Ship the installers
        run: cp install.sh install.ps1 dist/
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum tptforge-* > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

  quality:
    name: Release quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  npm:
    name: Build + publish npm packages
    # Configure a GitHub Environment named "release" with required reviewers
    # so publishing needs manual approval.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm --provenance signs via GitHub OIDC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org/
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1
      - name: Build Node wasm package
        run: wasm-pack build --target nodejs --out-dir node/pkg
        working-directory: tpt-stream-wasm
      - name: Test Node wrapper
        run: npm test
        working-directory: tpt-stream-wasm/node
      - name: Publish Node package
        run: npm publish --access public --provenance
        working-directory: tpt-stream-wasm/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Build browser wasm package
        run: wasm-pack build --target bundler --out-dir browser/pkg
        working-directory: tpt-stream-wasm
      - name: Test browser wrapper
        run: npm ci && npm test
        working-directory: tpt-stream-wasm/browser
      - name: Publish browser package
        run: npm publish --access public --provenance
        working-directory: tpt-stream-wasm/browser
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    name: Publish container image (GHCR)
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tptforge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-pypi:
    name: Publish to PyPI
    needs: build-wheels
    environment: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist