name: Playground (GitHub Pages)

on:
  push:
    branches: [master]
    paths:
      - "tpt-stream-wasm/**"
      - "tpt-stream-core/**"
      - "tpt-stream-columnar/**"
      - "tpt-csv/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build playground bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build browser wasm package
        run: wasm-pack build --target bundler --out-dir browser/pkg
        working-directory: tpt-stream-wasm
      - name: Install browser dependencies
        run: npm ci
        working-directory: tpt-stream-wasm/browser
      - name: Build playground
        run: npm run build:playground
        working-directory: tpt-stream-wasm/browser
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tpt-stream-wasm/browser/playground/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
