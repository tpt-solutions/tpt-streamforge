[package]
name = "tpt-stream-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "tptforge: TOML-driven ETL pipelines on the tpt-streamforge engine"
readme = "README.md"
categories = ["command-line-utilities", "database"]
keywords = ["cli", "etl", "toml", "sql", "data-engineering"]

[[bin]]
name = "tptforge"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
tpt-stream-core = { path = "../tpt-stream-core", version = "0.1.0", features = [
    "sqlite",
    "postgres",
    "s3",
    "gcs",
    "azure",
    "gzip",
    "http",
    "zstd",
] }
tokio = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
toml = "1"
indicatif = "0.18"
serde_json = { workspace = true }
sha2 = "0.11"
tempfile = "3"
clap_complete = "4"
clap_mangen = "0.3"

# `cargo binstall tpt-stream-cli` downloads the prebuilt archive from the GitHub
# release (see .github/workflows/release.yml) instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/tptforge-v{ version }-{ target }.{ archive-format }"
bin-dir = "tptforge-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
