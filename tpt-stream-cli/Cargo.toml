[package]
name = "tpt-stream-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "tptforge: YAML-driven ETL pipelines on the tpt-streamforge engine"
readme = "README.md"
categories = ["command-line-utilities", "database"]
keywords = ["cli", "etl", "yaml", "sql", "data-engineering"]

[[bin]]
name = "tptforge"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
tpt-stream-core = { path = "../tpt-stream-core", version = "0.1.0", features = [
    "sqlite",
    "postgres",
    "s3",
    "gcs",
    "azure",
    "gzip",
    "http",
    "zstd",
] }
tokio = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde_yaml = "0.9"
sqlparser = "0.52"
indicatif = "0.17"

[dev-dependencies]
tempfile = "3"
