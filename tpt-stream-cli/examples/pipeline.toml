# Runnable tptforge example: a small sales report.
#
#   cargo run -p tpt-stream-cli -- run examples/pipeline.toml
#   # or, with the binary installed:
#   tptforge run examples/pipeline.toml
#
# Reads examples/input.csv and writes examples/report.csv (paths are relative
# to tpt-stream-cli/, the crate root).
#
# This is a *feature tour*, not a second copy of templates/pipeline-starter:
# it shows the stages that only the CLI exposes as a top-level key
# (`limit`, `dead_letter`). The starter template is the minimal scaffold to copy
# into a new project; this one is here to be read for reference.

error_policy = "strict"

[source.csv]
path = "examples/input.csv"

[[stages]]
filter = "amount > 0"

[[stages]]
# `map` replaces the schema with exactly the listed columns, so keep `region`
# if later stages need it.
map = { region = "region", gross = "amount * 1.2" }

[[stages]]
expect = { rows_at_least = 1, no_nulls = ["region"] }

[[stages]]
aggregate = { group_by = ["region"], aggs = { gross = "sum", "*" = "count_all" } }

[[stages]]
sort = { columns = ["sum_gross"], descending = true }

[[stages]]
# CLI-only stages:
# `limit` keeps the first N rows; `dead_letter` writes rows a stage rejects to
# a CSV instead of aborting the run (it cannot be combined with aggregate/sort/
# dedup/join/expect, which carry state across batches).
limit = 20

[sink.csv]
path = "examples/report.csv"
