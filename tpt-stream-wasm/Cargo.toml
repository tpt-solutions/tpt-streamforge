[package]
name = "tpt-stream-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "In-memory ETL for JS/WASM (browser + Node.js)"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
tpt-stream-core = { path = "../tpt-stream-core", version = "0.1.0", default-features = false }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"