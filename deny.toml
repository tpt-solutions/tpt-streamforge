# Deny-by-default: any license not in the allow list is rejected, which keeps
# the copyleft families (GPL, AGPL, LGPL, MPL, SSPL, EUPL) out without listing
# them explicitly (cargo-deny >= 0.18 removed the explicit deny list).
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    # Permissive, non-copyleft: pulled in by url -> icu_* (IDNA) and
    # ureq/rustls -> webpki-roots (Mozilla root store data).
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # Public-domain-style: tiny-keccak (via arrow).
    "CC0-1.0",
]

# cbindgen is a build-time tool (generates the C header for tpt-stream-ffi);
# its MPL-2.0 code never ships in any artifact.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "cbindgen"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
# rustls-rustcrypto 0.0.2-alpha (our pure-Rust, MIT/Apache-2.0 crypto
# provider for rustls, chosen over `ring`'s OpenSSL-derived/Apache-2.0-only
# license — see the `http`/`s3`/`azure` features in tpt-stream-core) pins
# rustls-webpki 0.102.8, paste 1.0.15, and rsa 0.9.10 with no newer release
# to update to (last published 2024-04-24; still the crate's only release).
# Ignored here because none is reachable through how we use it:
ignore = [
    # `paste` is a transitive macro-only build dependency of the RustCrypto
    # crates rustls-rustcrypto composes (aes-gcm, ed25519-dalek, p256, ...);
    # no runtime attack surface, unmaintained status only.
    "RUSTSEC-2024-0436",
    # The following four are all rustls-webpki 0.102.8 advisories reachable
    # only via a misissued CA cert (wildcard/URI name constraints) or CRL
    # parsing; we use webpki solely to verify server certs on outbound TLS
    # connections to configured S3/GCS/Azure endpoints and never parse CRLs.
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    # Marvin Attack timing side-channel in rsa 0.9.10, with no patched
    # version released upstream. Only exploitable against code holding and
    # operating on an RSA private key; we only use rsa to verify RSA
    # signatures on server certs during the TLS handshake, never to hold or
    # operate on a private key.
    "RUSTSEC-2023-0071",
]
