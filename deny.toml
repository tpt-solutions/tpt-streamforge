# Deny-by-default: any license not in the allow list is rejected, which keeps
# the copyleft families (GPL, AGPL, LGPL, MPL, SSPL, EUPL) out without listing
# them explicitly (cargo-deny >= 0.18 removed the explicit deny list).
# Only MIT (and permissive peer licenses) are unconditionally allowed.
# Any crate whose ONLY license is Apache-2.0 (no MIT option) requires an
# explicit [[licenses.exceptions]] entry; that forces intentional review of
# every such dependency. Dual MIT/Apache-2.0 crates still pass because MIT
# is in this list. Tightened 2026-09-20 after removing all Apache-2.0-only
# shipping crates (arrow, ring, sqlparser, ryu) from the dependency tree.
[licenses]
allow = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]

# cbindgen is a build-time tool (generates the C header for tpt-stream-ffi);
# its MPL-2.0 code never ships in any artifact.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "cbindgen"

# target-lexicon is a build-time dependency of pyo3-build-config (build.rs
# only; nothing it touches ends up in any compiled artifact or wheel). It
# cannot be avoided without dropping PyO3 entirely; investigated 2026-09-20.
[[licenses.exceptions]]
allow = ["Apache-2.0 WITH LLVM-exception"]
name = "target-lexicon"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
# Ignored advisories, re-verified 2026-09-29 (`cargo tree -i <crate>` and
# `cargo deny check advisories`). Each has a review-by date: on or after it,
# re-run both, check whether rustls-rustcrypto has a newer release, and either
# drop the entry or extend the date with a fresh justification.
#
# rustls-rustcrypto 0.0.2-alpha (our pure-Rust, MIT/Apache-2.0 crypto
# provider for rustls, chosen over `ring`'s OpenSSL-derived/Apache-2.0-only
# license -- see the `http`/`s3`/`azure` features in tpt-stream-core) pins
# rustls-webpki 0.102.8, paste 1.0.15, and rsa 0.9.10 with no newer release
# to update to (last published 2024-04-24; still the crate's only release).
# `ring` opt-in was considered and rejected (Apache-2.0-only).
ignore = [
    # `paste` is a transitive macro-only build dependency of the RustCrypto
    # crates rustls-rustcrypto composes (aes-gcm, ed25519-dalek, p256, ...);
    # no runtime attack surface, unmaintained status only.
    { id = "RUSTSEC-2024-0436", reason = "proc-macro only, unmaintained; review by 2026-12-29" },
    # The following four are rustls-webpki 0.102.8 advisories (misissued-CA
    # name constraints, CRL parsing). Verified: `cargo tree -i
    # rustls-webpki@0.102.8` shows the only dependent is rustls-rustcrypto,
    # which imports just the `alg_id` signature-algorithm constants from it.
    # Certificate path validation, name checking and CRL handling all run in
    # rustls' own rustls-webpki 0.103.x (patched), so the vulnerable 0.102.8
    # verification code is never called.
    { id = "RUSTSEC-2026-0099", reason = "webpki 0.102.8 only supplies alg_id constants; validation uses 0.103.x; review by 2026-12-29" },
    { id = "RUSTSEC-2026-0104", reason = "webpki 0.102.8 only supplies alg_id constants; validation uses 0.103.x; review by 2026-12-29" },
    { id = "RUSTSEC-2026-0049", reason = "webpki 0.102.8 only supplies alg_id constants; validation uses 0.103.x; review by 2026-12-29" },
    { id = "RUSTSEC-2026-0098", reason = "webpki 0.102.8 only supplies alg_id constants; validation uses 0.103.x; review by 2026-12-29" },
    # Marvin Attack timing side-channel in rsa 0.9.10, with no patched
    # version released upstream. Only exploitable against code holding and
    # operating on an RSA private key; we only use rsa to verify RSA
    # signatures on server certs during the TLS handshake (public-key
    # operations), never to hold or operate on a private key.
    { id = "RUSTSEC-2023-0071", reason = "public-key verification only, no private key use; no upstream fix; review by 2026-12-29" },
]
