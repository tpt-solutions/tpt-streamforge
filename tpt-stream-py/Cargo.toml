[package]
name = "tpt-streamforge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Python wrapper for tpt-streamforge via PyO3"
readme = "README.md"
categories = ["development-tools::ffi"]
keywords = ["python", "etl", "pyo3", "pandas", "data-engineering"]

[lib]
name = "tpt_streamforge"
crate-type = ["cdylib"]

[dependencies]
tpt-stream-core = { path = "../tpt-stream-core", version = "0.1.0", features = [
    "sqlite",
    "postgres",
    "s3",
    "gcs",
    "azure",
    "gzip",
    "http",
    "zstd",
] }
tokio = { workspace = true }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
async-trait = { workspace = true }
arrow = { version = "54", default-features = false, features = ["pyarrow"] }
anyhow = { workspace = true }